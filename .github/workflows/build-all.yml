name: Build All Platforms

on:
  push:
    branches: [ main, develop, master, 002-audio-io-foundation ]
  pull_request:
    branches: [ main, develop, master, 002-audio-io-foundation ]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  # Windows 构建任务
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Package
        run: |
          mkdir release
          copy build\Release\audioBridge.exe release\
          copy build\Release\unit_tests.exe release\
          copy build\Release\integration_tests.exe release\
          copy build\Release\latency_benchmark.exe release\
          echo "Windows x64 Build" > release\PLATFORM.txt
          echo "Commit: ${{ github.sha }}" >> release\PLATFORM.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audioBridge-windows-x64
          path: release/*

  # Linux 构建任务
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            portaudio19-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --parallel $(nproc)

      - name: Package
        run: |
          mkdir release
          cp build/audioBridge release/
          cp build/unit_tests release/
          cp build/integration_tests release/
          cp build/latency_benchmark release/
          echo "Linux x64 Build" > release/PLATFORM.txt
          echo "Commit: ${{ github.sha }}" >> release/PLATFORM.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audioBridge-linux-x64
          path: release/*

  # macOS 构建任务（可选）
  build-macos:
    name: macOS x64
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake portaudio

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir release
          cp build/audioBridge release/
          cp build/unit_tests release/
          cp build/integration_tests release/
          cp build/latency_benchmark release/
          echo "macOS x64 Build" > release/PLATFORM.txt
          echo "Commit: ${{ github.sha }}" >> release/PLATFORM.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audioBridge-macos-x64
          path: release/*

  # 创建 GitHub Release（在 tag 时）
  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release packages
        run: |
          mkdir release

          # Windows
          cp audioBridge-windows-x64/* release/ 2>/dev/null || true
          cd release
          zip -r audioBridge-windows-x64.zip *.exe *.txt 2>/dev/null || true
          cd ..

          # Linux
          cp audioBridge-linux-x64/* release/ 2>/dev/null || true
          cd release
          tar czf audioBridge-linux-x64.tar.gz audioBridge unit_tests *.txt 2>/dev/null || true
          cd ..

          # macOS
          cp audioBridge-macos-x64/* release/ 2>/dev/null || true
          cd release
          tar czf audioBridge-macos-x64.tar.gz audioBridge unit_tests *.txt 2>/dev/null || true
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            audioBridge-windows-x64.zip
            audioBridge-linux-x64.tar.gz
            audioBridge-macos-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## Cross-Platform Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All platforms built successfully from commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
